<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Żuczki</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        #c {
            width: 100%;
            height: 100%;
            transition: 0.4s;
            opacity: 0.5;
            filter: blur(10px);
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: 0.4s;
        }

        #s {
            position: absolute;
            width: 300px;
            height: 300px;
            left: calc(50% - 150px);
            top: calc(50% - 290px);
            cursor: pointer;
            transition: 0.4s;
        }

        #s:hover {
            filter: brightness(1.2);
            transform: scale(1.04);
        }

        #nickname {
            position: absolute;
            width: 200px;
            height: 32px;
            margin: 0;
            padding: 0;
            left: calc(50% - 100px);
            top: calc(50% + 44px);
            border: 0;
            text-align: center;
            font-size: 20px;
            border: 2px solid lightgray;
            border-radius: 8px;
            box-sizing: border-box;
        }

        #play {
            position: absolute;
            margin: 0;
            padding: 0;
            width: 200px;
            height: 32px;
            left: calc(50% - 100px);
            top: calc(50% + 84px);
            border: 2px solid lightgray;
            border-radius: 8px;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 20px;
        }
    </style>
</head>


<body>
    <canvas id="c"></canvas>
    <div id="menu">
        <canvas id="s" width="400" height="400"></canvas>
        <input id="nickname" type="text" placeholder="nazwa" />
        <button id="play">Graj</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>


</html>
