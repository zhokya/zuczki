<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Żuczki</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        #c {
            width: 100%;
            height: 100%;
            transition: 0.4s;
            opacity: 0.5;
            filter: blur(10px);
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: 0.4s;
        }

        #s {
            position: absolute;
            transition:
                filter 0.4s,
                transform 0.4s,
                all 0.7s;
        }

        .notChoosingLooks {
            cursor: pointer;
            width: 300px;
            height: 300px;
            left: calc(50% - 150px);
            top: calc(50% - 290px);
        }
        .notChoosingLooks:hover {
            filter: brightness(1.2);
            transform: scale(1.04);
        }
        .choosingLooks {
            width: 500px;
            height: 500px;
            left: calc(25% - 250px);
            top: calc(50% - 320px);
        }

        #menu-fade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            background: white;
            transition: 0.4s;
        }

        #nickname {
            position: absolute;
            width: 200px;
            height: 32px;
            margin: 0;
            padding: 0;
            left: calc(50% - 100px);
            top: calc(50% + 44px);
            border: 0;
            text-align: center;
            font-size: 20px;
            border: 2px solid lightgray;
            border-radius: 8px;
            box-sizing: border-box;
            transition: 0.4s;
        }
        #play {
            position: absolute;
            margin: 0;
            padding: 0;
            width: 200px;
            height: 32px;
            left: calc(50% - 100px);
            top: calc(50% + 84px);
            border: 2px solid lightgray;
            border-radius: 8px;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 20px;
            transition: 0.4s;
        }

        #looks {
            position: absolute;
            left: 50%;
            width: 50%;
            top: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: 0.4s;
            opacity: 0;
            pointer-events: none;
            gap: 12px;
        }

        .color-picker {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(4, auto);
            gap: 2px;
        }
        .color-option {
            width: 15px;
            height: 15px;
            cursor: pointer;
            border: 1px solid black;
            border-radius: 4px;
            transition: 0.2s;
        }
        .color-option:hover {
            transform: scale(1.1);
        }

        #looks-save-options {
            display: flex;
            gap: 4px;
        }
        #looks-save, #looks-random {
            width: 32px;
            height: 32px;
            border: 2px solid black;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        #looks-save {
            background: rgb(255, 255, 255);
        }
        #looks-save:hover, #looks-random:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
        #looks-save img, #looks-random img {
            width: 28px;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="menu">
        <div id="menu-fade"></div>
        <canvas id="s" width="1024" height="1024" class="notChoosingLooks"></canvas>
        <input id="nickname" type="text" placeholder="nazwa" />
        <button id="play">Graj</button>
        <div id="looks">
            <input type="checkbox" id="looks-antennaDots" />
            <input type="range" min="0.0" max="0.5" step="any" id="looks-antennaSize" />
            <div id="looks-antennaColor" class="color-picker"></div>
            <div id="looks-mainColor" class="color-picker"></div>
            <div id="looks-insideColor" class="color-picker"></div>
            <div id="looks-save-options">
                <div id="looks-save"></div>
                <div id="looks-random"></div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>


</html>
